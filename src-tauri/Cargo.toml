[package]
name = "tauri-app"
version = "0.3.3"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "tauri-app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["approvals"]
approvals = []

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-drag = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["time", "net", "sync", "rt", "macros"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_Wmi",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Networking_NetworkListManager",
    "Devices_Radios",
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Networking_Connectivity",
    "Networking_NetworkOperators",
    "Storage_Streams",
] }
wmi = "0.14"
base64 = "0.22"
keyring = "4.2.0"
tauri-plugin-store = "2.5.0"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
log = "0.4"
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
url = "2"
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3", "vorbis"] }
axum = { version = "0.7", default-features = false, features = ["tokio", "http1", "http2", "ws", "json", "query"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "aws_lc_rs"] }
qrcode = { version = "0.14", default-features = false }
sha2 = "0.10"
rand = "0.8"
local-ip-address = "0.6"
subtle = "2.6"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["timeout"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
